[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "automl-agent"
version = "0.1.0"
description = "AutoML Agent – Autonomous Machine Learning System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "python-dotenv==1.0.1",
    "sqlalchemy==2.0.34",
    "asyncpg==0.29.0",
    "alembic==1.13.2",
    "pandas==2.2.2",
    "numpy>=1.26.0,<2.0.0",
    "scikit-learn==1.5.1",
    "xgboost==3.0.2",
    "optuna==4.1.0",
    "scipy==1.13.1",
    "mlflow==2.16.2",
    "langchain==0.3.7",
    "langchain-core==0.3.25",
    "langgraph==0.2.38",
    "langchain-groq==0.2.0",
    "matplotlib==3.9.2",
    "seaborn==0.13.2",
    "python-multipart==0.0.9",
    "httpx==0.27.2",
    "joblib==1.4.2",
    "tqdm==4.66.5",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "httpx==0.27.2",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"