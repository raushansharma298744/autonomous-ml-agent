services:
  postgres:
    image: postgres:16-alpine
    container_name: automl-agent-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: automl_ml
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    image: python:3.12-slim
    container_name: automl-agent-mlflow
    working_dir: /app
    command: >
      sh -c "pip install mlflow==2.16.2 psycopg2-binary==2.9.9 &&
             mlflow server --host 0.0.0.0 --port 5000
             --backend-store-uri postgresql://postgres:postgres@postgres:5432/automl_ml
             --default-artifact-root /mlruns"
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://localhost:5000

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: automl-agent-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./datasets:/app/datasets
      - ./mlruns:/app/mlruns
      - ./reports:/app/reports
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/automl_ml
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - GROQ_API_KEY=${GROQ_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-llama-3.3-70b-versatile}
      - DEBUG=true
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: automl-agent-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data: